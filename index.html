<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clouds Away: 5-day weather forecast – OpenWeatherMap</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Clouds Away: 5-day weather forecast</h1>
    <p class="subtitle">Search for a city to view its 5-day temperature forecast in °C.</p>

    <div class="controls">
      <label for="kaupunki">City:</label>
      <input type="text" id="kaupunki" value="Helsinki" />

      <label for="apiKey">API key:</label>
      <input type="password" id="apiKey" />

      <button id="haeSaaPainike">Get weather</button>
    </div>

    <p id="saaYllatys" style="display: none;">&#9729; Let's see what the weather has in store for us!</p>

    <div class="controls">
      <label for="chartType">Chart type:</label>
      <select id="chartType" onchange="paivitaKaavio()">
        <option value="line">Line</option>
        <option value="bar">Bar</option>
      </select>

      <button id="detailsBtn" type="button">Show forecast details</button>
    </div>

    <p id="statusMessage"></p>
    <h2 id="cityTitle"></h2>
    <canvas id="tempChart" width="400" height="200"></canvas>
  </main>
<!-- Included the sweetalert2 library -->
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  <script src="script.js"></script>

  <!-- Animated 3D cloud background -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
  <script>
    if (typeof VANTA !== "undefined") {
      VANTA.CLOUDS({
        el: "body",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        skyColor: 0x7289b3,
        speed: 0.40
      });
    }
  </script>
</body>

</html>
